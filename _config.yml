# GitHub Pages / Jekyll Minimal theme configuration

title: German W Aparicio Jr
description: CV and Data Science Work Samples
url: "https://gaparicio.github.io"
baseurl: ""

author:
  name: German W Aparicio Jr
  email: gapariciojr@gmail.com

theme: jekyll-theme-minimal
show_downloads: false

# Defaults
# - use Minimal's `default` layout for site pages and posts
#   (the Minimal theme does not ship a `post` layout)
defaults:
  -
    scope:
      path: ""
      type: pages
    values:
      layout: default
  -
    scope:
      path: ""
      type: posts
    values:
      layout: default
